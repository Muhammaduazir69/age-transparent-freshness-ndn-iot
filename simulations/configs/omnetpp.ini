# ===========================================================================
# TARA: expected-utility retention and admission.
# Score U(i) = lambda_i * R_i * c_i, the decayed local request rate, the TRUE
# residual life on the producer's clock, and the hops a hit would save. The
# same score gates admission (a candidate enters with one rate credit) and
# picks the eviction victim, so the rule carries no tuned threshold.
[Config TARA]
extends = FixedNew
**.ndn.processor.experts = "TARA-TARA"

# --- factor ablations: drop one term of the product at a time --------------
# admission only (LRU decides the victim)
[Config TARA-AdmitOnly]
extends = FixedNew
**.ndn.processor.experts = "TARA-LRU"

# retention only (everything is admitted)
[Config TARA-EvictOnly]
extends = FixedNew
**.ndn.processor.experts = "LCE-TARA"

# age term alone, on the origin clock (no rate, no distance)
[Config Base-LCE-LFFO]
extends = FixedNew
**.ndn.processor.experts = "LCE-LFFO"

# Additive control: the same three factors, equally weighted sum of min-max
# normalised terms. Separates the choice of factors from the functional form.
[Config TARA-Additive]
extends = FixedNew
**.ndn.processor.experts = "TARA-TARAADD"

# Additive control with leave-copy-everywhere admission (form effect alone)
[Config TARA-Additive-LCE]
extends = FixedNew
**.ndn.processor.experts = "LCE-TARAADD"

# pCASTING (Hail et al., IEEE RIoT 2015): probabilistic admission from battery
# level, cache occupancy and residual freshness on the producer's clock,
# normalised and weighted. Admission only; LRU evicts, as in the original.
[Config Base-pCASTING]
extends = FixedNew
**.ndn.processor.experts = "PCAST-LRU"

# ===========================================================================
# Age-transparent freshness: a cached copy expires at the end of the
# producer's lifetime instead of one FreshnessPeriod after local arrival.
# Each AT-* configuration is its standard-NDN counterpart with this one
# switch changed, so the difference between the pair is the protocol change
# and nothing else.
[Config AT-LCE-LRU]
extends = Fixed-LCE-LRU
**.cs.ageTransparent = true

[Config AT-LCE-LFUA]
extends = Fixed-LCE-LFUA
**.cs.ageTransparent = true

[Config AT-LCD-LRU]
extends = Fixed-LCD-LRU
**.cs.ageTransparent = true

[Config AT-LCE-LFFO]
extends = Base-LCE-LFFO
**.cs.ageTransparent = true

[Config AT-TARA]
extends = TARA
**.cs.ageTransparent = true

[Config AT-TARA-EvictOnly]
extends = TARA-EvictOnly
**.cs.ageTransparent = true

[Config AT-pCASTING]
extends = Base-pCASTING
**.cs.ageTransparent = true

# ===========================================================================
# Scenario 2, "ShadeField": a distributed sensing field. Every one of the 36
# sensors publishes its own readings under /campus/env/n<id> and also consumes
# from the whole field, so the copies in a node's store were fetched over a
# range of path lengths rather than all from one sink. Requests keep the Zipf
# ranking over the whole catalogue; item k is published by sensor k mod 36.
[Config Field]
abstract = true
extends = ShadeBase
*.sensor[*].app[0].producedPrefix = "/campus/env/n" + string(parentIndex())
*.sensor[*].app[0].isConsumer = true
*.sensor[*].app[0].enableCaching = true
*.sensor[*].app[0].producerCount = 36

[Config Field-LCE-LRU]
extends = Field
**.ndn.processor.selector = "fixed"
**.ndn.processor.fixedExpert = 0
**.ndn.processor.experts = "LCE-LRU"

[Config Field-AT-LCE-LRU]
extends = Field-LCE-LRU
**.cs.ageTransparent = true

[Config Field-LCD-LRU]
extends = Field
**.ndn.processor.selector = "fixed"
**.ndn.processor.fixedExpert = 0
**.ndn.processor.experts = "LCD-LRU"

[Config Field-AT-LCD-LRU]
extends = Field-LCD-LRU
**.cs.ageTransparent = true

[Config Field-LCE-LFUA]
extends = Field
**.ndn.processor.selector = "fixed"
**.ndn.processor.fixedExpert = 0
**.ndn.processor.experts = "LCE-LFUA"

[Config Field-AT-LCE-LFUA]
extends = Field-LCE-LFUA
**.cs.ageTransparent = true

[Config Field-pCASTING]
extends = Field
**.ndn.processor.selector = "fixed"
**.ndn.processor.fixedExpert = 0
**.ndn.processor.experts = "PCAST-LRU"

[Config Field-AT-pCASTING]
extends = Field-pCASTING
**.cs.ageTransparent = true

# --- remaining age-transparent pairs -------------------------------------
[Config AT-TLFU-LRU]
extends = Fixed-TLFU-LRU
**.cs.ageTransparent = true

[Config AT-FRESH-LFFO]
extends = Fixed-FRESH-LFFO
**.cs.ageTransparent = true

[Config AT-LeCaR]
extends = LeCaR
**.cs.ageTransparent = true

[Config AT-DOOR-LRU]
extends = Fixed-DOOR-LRU
**.cs.ageTransparent = true

[Config AT-SHADE]
extends = SHADE
**.cs.ageTransparent = true

# --- Content Store size sweep, standard against age-transparent ----------
[Config C5-LCE-LRU]
extends = Fixed-LCE-LRU
*.sensor[*].app[0].csMaxEntries = 5
[Config C5-AT-LCE-LRU]
extends = AT-LCE-LRU
*.sensor[*].app[0].csMaxEntries = 5
[Config C20-LCE-LRU]
extends = Fixed-LCE-LRU
*.sensor[*].app[0].csMaxEntries = 20
[Config C20-AT-LCE-LRU]
extends = AT-LCE-LRU
*.sensor[*].app[0].csMaxEntries = 20
[Config C40-LCE-LRU]
extends = Fixed-LCE-LRU
*.sensor[*].app[0].csMaxEntries = 40
[Config C40-AT-LCE-LRU]
extends = AT-LCE-LRU
*.sensor[*].app[0].csMaxEntries = 40

# Learned admission (tabular Q-learning) with and without the rule, so the
# claim about hit-driven learning is tested on a policy that needs no
# external bridge as well as on the deep RL comparator.
[Config AT-QL-LRU]
extends = Fixed-QL-LRU
**.cs.ageTransparent = true

# Deep RL comparator under the rule.
[Config AT-DRL]
extends = DRL
**.cs.ageTransparent = true

# Clock-free realization: the residual lifetime is carried in FreshnessPeriod
# and decremented at each hand-off instead of being read from the publisher's
# timestamp. Compared against AT-LCE-LRU, which uses the timestamp.
[Config ATD-LCE-LRU]
extends = AT-LCE-LRU
**.cs.ageMode = "decrement"

# ===========================================================================
# The obvious alternative to changing the clock: leave the per-hop rule alone
# and have publishers under-declare the lifetime, so a copy expires before it
# can accumulate much age. The network then enforces 1/k of the nominal
# 30/90/300 s while the application still needs the nominal value, which is
# what validityScale restores for the staleness test. Without that separation
# the comparison would move the definition of "stale" along with the knob.
[Config Short2-LCE-LRU]
extends = Fixed-LCE-LRU
*.sensor[*].app[0].freshnessClasses = "15,45,150"
*.sensor[*].app[0].validityScale = 2.0

[Config Short3-LCE-LRU]
extends = Fixed-LCE-LRU
*.sensor[*].app[0].freshnessClasses = "10,30,100"
*.sensor[*].app[0].validityScale = 3.0

[Config Short4-LCE-LRU]
extends = Fixed-LCE-LRU
*.sensor[*].app[0].freshnessClasses = "7.5,22.5,75"
*.sensor[*].app[0].validityScale = 4.0

# ===========================================================================
# Partial deployment: the rule is switched on at half the field (sensors 0 to
# 17, the three rows furthest from the publisher at sensor 35) and left off at
# the rest. Under the timestamp form each upgraded node is correct on its own.
# Under the clock-free form an unupgraded node still honors a decremented
# FreshnessPeriod correctly, it just does not subtract its own residence time
# before handing the copy on, so the information decays along the unupgraded
# part of the path.
[Config Half-AT-LCE-LRU]
extends = Fixed-LCE-LRU
*.sensor[0..17].app[0].ndn.cs.ageTransparent = true

[Config Half-ATD-LCE-LRU]
extends = Fixed-LCE-LRU
*.sensor[0..17].app[0].ndn.cs.ageTransparent = true
*.sensor[0..17].app[0].ndn.cs.ageMode = "decrement"

# The complementary half, as a control. Sensors 0 to 17 are the rows furthest
# from the publisher and carry most of the staleness, so upgrading them is the
# favorable choice; upgrading the eighteen nearest the publisher instead bounds
# how much of the partial-deployment result is the rule and how much is where
# the rule was put.
[Config HalfNear-AT-LCE-LRU]
extends = Fixed-LCE-LRU
*.sensor[18..35].app[0].ndn.cs.ageTransparent = true

# ===========================================================================
# Freshness-Driven Caching (FDC), Amadeo et al., Sensors 2020, Sec. 5.4.
# The published scheme has two halves and they are run apart so that each can
# be attributed:
#   FDC-LRU admission  caches an arriving copy with probability one when its
#                      residual freshness period is at or above a moving
#                      average of the residual periods the node has seen, and
#                      with probability RFP/Th below it
#   residual expiry    holds the copy for its residual freshness period rather
#                      than a full declared lifetime, which is the timestamp
#                      realization of age transparency
# Fixed-FDCA-LRU is the admission rule on the standard per-hop expiry NDN
# prescribes; AT-FDCA-LRU is the published scheme, both halves together.
[Config Fixed-FDCA-LRU]
description = "FDC admission rule (Amadeo et al. 2020) on the standard per-hop expiry rule"
extends = FixedNew
**.ndn.processor.experts = "FDC-LRU"

[Config AT-FDCA-LRU]
description = "FDC as published: freshness-driven admission with residual-lifetime expiry"
extends = Fixed-FDCA-LRU
**.cs.ageTransparent = true

[Config ATD-FDCA-LRU]
description = "FDC admission with the clock-free expiry realization (no timestamp, no shared clock)"
extends = AT-FDCA-LRU
**.cs.ageMode = "decrement"

[Config C5-FDCA-LRU]
extends = Fixed-FDCA-LRU
*.sensor[*].app[0].csMaxEntries = 5
[Config C20-FDCA-LRU]
extends = Fixed-FDCA-LRU
*.sensor[*].app[0].csMaxEntries = 20

[Config Field-FDCA-LRU]
extends = Field
**.ndn.processor.selector = "fixed"
**.ndn.processor.fixedExpert = 0
**.ndn.processor.experts = "FDC-LRU"

[Config Field-AT-FDCA-LRU]
extends = Field-FDCA-LRU
**.cs.ageTransparent = true

# ===========================================================================
# Versioned naming, the second alternative that needs no protocol change. Each
# reading is named for the generation it belongs to, so a cached copy is never
# the wrong version and staleness in the sense this paper measures cannot
# arise. Consumers derive the version component from a schedule they share,
# which is the first of the two name-discovery routes and is itself a
# synchronization requirement. The cost is that a copy becomes unusable at the
# version boundary rather than at the end of the reading's life, so cache reuse
# is bounded by the version interval. Everything else matches Fixed-LCE-LRU.
[Config Ver30-LCE-LRU]
description = "Versioned naming, 30 s version interval, standard per-hop expiry"
extends = Fixed-LCE-LRU
*.sensor[*].app[0].consumer.versionInterval = 30s

[Config Ver90-LCE-LRU]
description = "Versioned naming, 90 s version interval, standard per-hop expiry"
extends = Fixed-LCE-LRU
*.sensor[*].app[0].consumer.versionInterval = 90s
